[project]
name = "bib-generate"
version = "0.1.0"
description = "Generador de dorsales personalizados para TEMPO RUN"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0.0",
    "qrcode[pil]>=7.4.2",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "click>=8.1.0",
]

[project.scripts]
bib-generate = "bib_generate.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bib_generate"]
